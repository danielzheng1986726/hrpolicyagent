<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星辰 HR 政策小灵通 · 不好意思问HR?问它!</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #FDF6E3;
            background-image: radial-gradient(#D8D2C2 1.5px, transparent 1.5px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #FFFDF7;
            border: 3px solid #111;
            border-radius: 16px;
            box-shadow: 8px 8px 0 #111;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
        }

        .header {
            background: #FFD93D;
            color: #111;
            padding: 18px 24px;
            border-bottom: 3px solid #111;
            border-radius: 13px 13px 0 0;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        #mascot {
            display: inline-block;
            font-size: 30px;
            margin-right: 6px;
            vertical-align: -3px;
        }

        #mascot.thinking {
            animation: bob 0.8s ease-in-out infinite;
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .lv-badge {
            display: inline-block;
            background: #FFFDF7;
            color: #111;
            border: 2px solid #111;
            font-size: 12px;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 10px;
            vertical-align: 6px;
            margin-left: 6px;
        }

        .header p {
            font-size: 13.5px;
            font-weight: 500;
        }

        .badge-bar {
            display: inline-block;
            margin-top: 8px;
            background: #FFFDF7;
            border: 2px solid #111;
            border-radius: 14px;
            box-shadow: 2px 2px 0 #111;
            padding: 3px 12px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: default;
        }

        .badge-bar .badge-slot {
            opacity: 0.25;
            margin: 0 1px;
        }

        .badge-bar .badge-slot.unlocked {
            opacity: 1;
        }

        .badge-bar.bump {
            animation: pop 0.35s cubic-bezier(.3,1.4,.6,1);
        }

        .unlock-float {
            position: fixed;
            left: 50%;
            top: 120px;
            transform: translateX(-50%);
            background: #FFD93D;
            border: 3px solid #111;
            border-radius: 12px;
            box-shadow: 4px 4px 0 #111;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: 800;
            pointer-events: none;
            animation: unlockPop 2s ease-out forwards;
            z-index: 99;
        }

        @keyframes unlockPop {
            0% { opacity: 0; transform: translateX(-50%) scale(0.7); }
            12% { opacity: 1; transform: translateX(-50%) scale(1.06); }
            20% { transform: translateX(-50%) scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-24px) scale(1); }
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: transparent;
            position: relative;
        }

        .chat-area::-webkit-scrollbar {
            width: 6px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: #C9C2B0;
            border-radius: 3px;
        }

        .chat-area::-webkit-scrollbar-thumb:hover {
            background: #A89F87;
        }

        .message {
            margin-bottom: 18px;
            display: flex;
            animation: pop 0.25s cubic-bezier(.3,1.4,.6,1);
        }

        @keyframes pop {
            0% { opacity: 0; transform: scale(0.85); }
            60% { transform: scale(1.04); }
            100% { opacity: 1; transform: scale(1); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message > div {
            max-width: 70%;
        }

        .message-content {
            padding: 12px 16px;
            border: 3px solid #111;
            border-radius: 12px;
            box-shadow: 4px 4px 0 #111;
            word-wrap: break-word;
            line-height: 1.55;
        }

        .message.user .message-content {
            background: #FF8BA7;
            color: #111;
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-content {
            background: #FFD93D;
            color: #111;
            border-bottom-left-radius: 4px;
        }

        /* Markdown样式 */
        .message.ai .message-content h1,
        .message.ai .message-content h2,
        .message.ai .message-content h3 {
            margin-top: 16px;
            margin-bottom: 8px;
            font-weight: 700;
            line-height: 1.3;
        }

        .message.ai .message-content h1 { font-size: 20px; }
        .message.ai .message-content h2 { font-size: 18px; }
        .message.ai .message-content h3 { font-size: 16px; }

        .message.ai .message-content p { margin-bottom: 8px; }

        .message.ai .message-content ul,
        .message.ai .message-content ol {
            margin: 8px 0;
            padding-left: 24px;
        }

        .message.ai .message-content li { margin: 4px 0; }
        .message.ai .message-content strong { font-weight: 700; }
        .message.ai .message-content em { font-style: italic; }

        .message.ai .message-content code {
            background: rgba(0, 0, 0, 0.12);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .message.ai .message-content pre {
            background: rgba(0, 0, 0, 0.07);
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .message.ai .message-content pre code {
            background: none;
            padding: 0;
        }

        .message.ai .message-content blockquote {
            border-left: 3px solid #111;
            padding-left: 12px;
            margin: 8px 0;
            color: #444;
        }

        .message-label {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #555;
        }

        /* 建议问题 chips */
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 4px 0 20px 0;
            animation: pop 0.3s cubic-bezier(.3,1.4,.6,1);
        }

        .chip {
            background: #FFFDF7;
            border: 2.5px solid #111;
            border-radius: 20px;
            box-shadow: 3px 3px 0 #111;
            padding: 7px 14px;
            font-size: 13.5px;
            font-weight: 600;
            color: #111;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .chip:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 #111;
            background: #FFF3C4;
        }

        .chip:active {
            transform: translate(3px, 3px);
            box-shadow: 0 0 0 #111;
        }

        .input-area {
            padding: 18px 20px;
            background: #FFFDF7;
            border-top: 3px solid #111;
            border-radius: 0 0 13px 13px;
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        #messageInput {
            width: 100%;
            padding: 12px 16px;
            border: 3px solid #111;
            border-radius: 12px;
            box-shadow: 3px 3px 0 #111;
            background: #fff;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            min-height: 48px;
            max-height: 120px;
            transition: box-shadow 0.15s;
        }

        #messageInput::placeholder {
            color: #A89F87;
        }

        #messageInput:focus {
            outline: none;
            box-shadow: 5px 5px 0 #111;
        }

        #messageInput:disabled {
            background: #f0ece0;
            cursor: not-allowed;
        }

        #sendButton {
            padding: 12px 28px;
            background: #58CC02;
            color: #fff;
            border: 3px solid #111;
            border-bottom-width: 7px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            font-family: inherit;
            letter-spacing: 2px;
            cursor: pointer;
            min-width: 88px;
            transition: filter 0.1s;
        }

        #sendButton:hover:not(:disabled) {
            filter: brightness(1.08);
        }

        #sendButton:active:not(:disabled) {
            border-bottom-width: 3px;
            transform: translateY(4px);
        }

        #sendButton:disabled {
            background: #b9b3a4;
            cursor: not-allowed;
            border-bottom-width: 3px;
            transform: translateY(4px);
        }

        .loading {
            display: inline-block;
            color: #333;
            font-style: italic;
        }

        .error {
            color: #111;
            background: #FF8BA7;
            border: 2.5px solid #111;
            padding: 10px 14px;
            border-radius: 8px;
        }

        /* +10 经验值飘字 */
        .xp-float {
            position: fixed;
            right: 36px;
            bottom: 110px;
            font-size: 15px;
            font-weight: 800;
            color: #58CC02;
            text-shadow: 1.5px 1.5px 0 #111;
            pointer-events: none;
            animation: xpUp 1.4s ease-out forwards;
            z-index: 99;
        }

        @keyframes xpUp {
            0% { opacity: 0; transform: translateY(0); }
            15% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-70px); }
        }

        @media (max-width: 600px) {
            body { padding: 0; }

            .container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                border-left: none;
                border-right: none;
                box-shadow: none;
            }

            .header { border-radius: 0; }
            .header h1 { font-size: 22px; }
            .message > div { max-width: 85%; }
            .input-area { border-radius: 0; }

            #messageInput {
                font-size: 16px; /* 防止iOS自动缩放 */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span id="mascot">🐥</span>星辰 HR 政策小灵通<span class="lv-badge">Lv.99</span></h1>
            <p>病假、年假、离职流程——不好意思问 HR 的,偷偷问我 🤫</p>
            <div class="badge-bar" id="badgeBar" title="问不同类别的政策问题,集齐六枚图鉴!"></div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message ai">
                <div>
                    <div class="message-label">小策</div>
                    <div class="message-content">
                        嗨!我是小策 🐥,星辰科技编外员工,工号 004。我读完了公司全部政策文件,现在脑子里只有制度。年假病假五险一金,考我,别客气——放心,我不会翻白眼,也不会记住你是谁。
                    </div>
                </div>
            </div>
            <div class="chips" id="chips">
                <button class="chip">我到底能休几天年假?😴</button>
                <button class="chip">病假工资怎么算?🤒</button>
                <button class="chip">离职要提前多久打招呼?🏃</button>
                <button class="chip">年终奖怎么算?👀</button>
            </div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea
                        id="messageInput"
                        placeholder="偷偷问我点什么…"
                        rows="1"
                    ></textarea>
                </div>
                <button id="sendButton">问!</button>
            </div>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const mascot = document.getElementById('mascot');

        // 等待时的轮播文案(评委一定会盯着这里)
        const LOADING_LINES = [
            '正在翻员工手册第 42 页…',
            '正在敲 HRBP 的门…咚咚咚',
            '翻箱倒柜找红头文件中…',
            '正在假装思考,其实已经知道答案了',
            '让我查查这条政策改没改…',
            '顺便说一句,你今天气色不错 ✨',
        ];

        function setMascot(emoji, thinking) {
            mascot.textContent = emoji;
            mascot.classList.toggle('thinking', !!thinking);
        }

        // ===== 政策探索度图鉴 =====
        const CATEGORIES = [
            { key: 'annual',  name: '年假假期', icon: '🏖️', re: /年假|调休|休假|婚假|产假|陪产假|事假/, q: '我到底能休几天年假?' },
            { key: 'sick',    name: '病假医疗', icon: '🤒', re: /病假|医疗期|工伤|体检/, q: '病假工资怎么算?' },
            { key: 'pay',     name: '薪酬福利', icon: '💰', re: /工资|薪|年终奖|奖金|五险|公积金|福利|报销|补贴/, q: '年终奖怎么算?' },
            { key: 'leave',   name: '离职流程', icon: '🏃', re: /离职|辞职|裁员|合同到期|竞业/, q: '离职要提前多久打招呼?' },
            { key: 'onboard', name: '入职转正', icon: '🌱', re: /入职|转正|试用期|offer|背调/i, q: '试用期多久能转正?' },
            { key: 'time',    name: '加班考勤', icon: '⏰', re: /加班|工时|考勤|打卡|迟到|远程|居家/, q: '加班有加班费或者调休吗?' },
        ];

        // ===== 追问建议:placeholder 只从未解锁的图鉴类别里轮播 =====
        let currentHint = null;

        function refreshHint() {
            const owned = loadBadges();
            const locked = CATEGORIES.filter(c => !owned.has(c.key));
            if (locked.length === 0) {
                currentHint = null;
                messageInput.placeholder = '六枚图鉴已集齐 🏆 还想知道点什么?';
                return;
            }
            const pick = locked[Math.floor(Math.random() * locked.length)];
            currentHint = pick.q;
            messageInput.placeholder = `试试问:${pick.q} ${pick.icon}`;
        }

        setInterval(() => {
            if (!messageInput.value) refreshHint();
        }, 5000);

        // 桌面端小彩蛋:输入框为空时按 Tab,直接填入当前提示
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Tab' && !this.value && currentHint) {
                e.preventDefault();
                this.value = currentHint;
                this.dispatchEvent(new Event('input'));
            }
        });

        function loadBadges() {
            try { return new Set(JSON.parse(localStorage.getItem('xc_badges') || '[]')); }
            catch { return new Set(); }
        }

        function renderBadges(bump) {
            const owned = loadBadges();
            const bar = document.getElementById('badgeBar');
            bar.innerHTML = '政策图鉴 ' +
                CATEGORIES.map(c =>
                    `<span class="badge-slot${owned.has(c.key) ? ' unlocked' : ''}" title="${c.name}">${c.icon}</span>`
                ).join('') +
                ` ${owned.size}/${CATEGORIES.length}`;
            if (bump) {
                bar.classList.remove('bump');
                void bar.offsetWidth;
                bar.classList.add('bump');
            }
        }

        function checkBadges(message) {
            const owned = loadBadges();
            for (const c of CATEGORIES) {
                if (!owned.has(c.key) && c.re.test(message)) {
                    owned.add(c.key);
                    localStorage.setItem('xc_badges', JSON.stringify([...owned]));
                    renderBadges(true);
                    refreshHint();
                    const toast = document.createElement('div');
                    toast.className = 'unlock-float';
                    toast.textContent = `${c.icon} 解锁「${c.name}」图鉴!` +
                        (owned.size === CATEGORIES.length ? ' 六枚集齐,你已经比大部分同事懂公司了 🏆' : '');
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 2100);
                    break;
                }
            }
        }

        renderBadges(false);

        // 自动调整输入框高度
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // Enter发送,Shift+Enter换行
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 发送按钮点击
        sendButton.addEventListener('click', sendMessage);

        // 建议问题 chips
        document.getElementById('chips').addEventListener('click', function(e) {
            const chip = e.target.closest('.chip');
            if (!chip) return;
            messageInput.value = chip.textContent.replace(/[😴🤒🏃👀]/g, '').trim();
            this.remove();
            sendMessage();
        });

        // 彩蛋:本地拦截,不走接口
        function localEasterEgg(message) {
            if (/你是谁|你叫什么/.test(message)) {
                return '我是**小策** 🐥,星辰科技编外员工,工号 004。不领工资,不休年假(因为我没有),24 小时在线。我的全部人生意义,就是替 HR 回答那些他们一年要答四百遍的问题。';
            }
            return null;
        }

        // 彩蛋:先插一句俏皮话,再出正经答案
        function quipFor(message) {
            if (/加班/.test(message)) return '辛苦了,先给你一杯赛博咖啡 ☕ 然后我们看制度怎么说——';
            if (/涨薪|工资|薪水|年终奖/.test(message)) return '🤐 这个问题嘛…我只能说,制度上是这么写的:';
            return null;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || sendButton.disabled) return;

            // 添加用户消息
            addMessage('user', message);
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // 政策图鉴解锁检查
            checkBadges(message);

            // 本地彩蛋:直接回答,不打扰后端
            const egg = localEasterEgg(message);
            if (egg) {
                setMascot('🎉', false);
                addMessage('ai', egg);
                setTimeout(() => setMascot('🐥', false), 2000);
                return;
            }

            // 禁用输入和按钮
            messageInput.disabled = true;
            sendButton.disabled = true;
            sendButton.textContent = '…';
            setMascot('🤔', true);

            // 俏皮话垫场
            const quip = quipFor(message);
            if (quip) addMessage('ai', quip, true);

            // 添加加载消息(文案轮播)
            const loadingElement = addMessage('ai', '<span class="loading">' + LOADING_LINES[0] + '</span>', true);
            let lineIdx = 1;
            const loadingTimer = setInterval(() => {
                const span = loadingElement.querySelector('.loading');
                if (span) span.textContent = LOADING_LINES[lineIdx % LOADING_LINES.length];
                lineIdx++;
            }, 1800);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                clearInterval(loadingTimer);
                removeMessage(loadingElement);

                setMascot('🎉', false);
                addMessage('ai', data.reply);
                floatXP();
                setTimeout(() => setMascot('🐥', false), 2000);

            } catch (error) {
                console.error('Error:', error);

                clearInterval(loadingTimer);
                removeMessage(loadingElement);

                setMascot('😵', false);
                addMessage('ai', '<div class="error">糟糕,我的小脑瓜卡住了 😵 网络开小差了——不是你的问题,是我的。再问一次试试?</div>', true);
                setTimeout(() => setMascot('🐥', false), 2500);
            } finally {
                // 恢复输入和按钮
                messageInput.disabled = false;
                sendButton.disabled = false;
                sendButton.textContent = '问!';
                messageInput.focus();
            }
        }

        // 答完飘 +10 政策经验值
        function floatXP() {
            const xp = document.createElement('div');
            xp.className = 'xp-float';
            xp.textContent = '+10 政策经验值 ✨';
            document.body.appendChild(xp);
            setTimeout(() => xp.remove(), 1500);
        }

        function addMessage(type, content, isHtml = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const label = type === 'user' ? '您' : '小策';
            const labelDiv = document.createElement('div');
            labelDiv.className = 'message-label';
            labelDiv.textContent = label;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            // 用户消息:使用textContent防止XSS(纯文本显示)
            // AI消息:使用marked.parse()渲染Markdown,或isHtml时直接使用innerHTML
            if (type === 'user') {
                contentDiv.textContent = content;
            } else {
                // AI消息:如果是HTML(如加载提示、错误消息),直接使用;否则渲染Markdown
                if (isHtml) {
                    contentDiv.innerHTML = content;
                } else {
                    // 使用marked.js渲染Markdown
                    if (typeof marked !== 'undefined') {
                        contentDiv.innerHTML = marked.parse(content);
                    } else {
                        // 如果marked.js未加载,降级为纯文本
                        contentDiv.textContent = content;
                    }
                }
            }

            const wrapperDiv = document.createElement('div');
            wrapperDiv.appendChild(labelDiv);
            wrapperDiv.appendChild(contentDiv);
            messageDiv.appendChild(wrapperDiv);

            chatArea.appendChild(messageDiv);
            scrollToBottom();

            return messageDiv;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function removeMessage(messageElement) {
            if (messageElement && messageElement.parentNode) {
                messageElement.parentNode.removeChild(messageElement);
            }
        }

        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // 页面加载后聚焦输入框
        window.addEventListener('load', () => {
            messageInput.focus();
        });
    </script>
</body>
</html>
